<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>WANTED | Compras y Ventas - Subasta Inversa Global</title>
    <meta name="description" content="La plataforma global donde los compradores publican qué buscan y los vendedores compiten por ofrecer el precio más bajo. Comercio inteligente y seguro.">
    <meta name="keywords" content="compras, ventas, subasta inversa, marketplace global, ofertas, teléfonos inteligentes, repuestos, playstation">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --amarillo: #FFD700;
            --negro-puro: #0a0a0a;
            --negro-card: #141414;
            --gris-texto: #8e8e93;
            --blanco: #ffffff;
            --azul-paypal: #0070ba;
        }

        body { background-color: var(--negro-puro); color: var(--blanco); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

        header { width: 100%; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; background: rgba(0,0,0,0.95); position: sticky; top: 0; z-index: 1000; box-sizing: border-box; }
        
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 900; color: var(--amarillo); letter-spacing: -1px; cursor: pointer; }
        .logo-icon { width: 35px; height: 35px; background: var(--amarillo); color: #000; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1.4rem; font-weight: 900; }
        
        .lang-switch { font-size: 0.7rem; background: #222; border: 1px solid #444; color: #fff; padding: 5px; border-radius: 5px; cursor: pointer; }

        .container { width: 95%; max-width: 450px; margin-top: 20px; }

        .trending-bar { width: 100%; overflow: hidden; background: #1a1a1a; padding: 10px 0; border-bottom: 1px solid #333; margin-bottom: 20px; font-size: 0.75rem; white-space: nowrap; }
        .trending-track { display: inline-block; animation: scroll 20s linear infinite; }
        @keyframes scroll { from { transform: translateX(100%); } to { transform: translateX(-100%); } }
        .trending-item { margin-right: 30px; color: var(--gris-texto); }
        .trending-item span { color: var(--amarillo); font-weight: bold; }

        .card { background: var(--negro-card); padding: 30px; border-radius: 24px; border: 1px solid #333; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-size: 1.6rem; font-weight: 900; margin-bottom: 10px; }
        h1 span { color: var(--amarillo); }

        input { width: 100%; padding: 16px; margin-bottom: 15px; background: #000; border: 1px solid #333; border-radius: 12px; color: #fff; box-sizing: border-box; font-size: 1rem; }
        .btn-main { width: 100%; padding: 18px; background: var(--amarillo); color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; }

        .pedido-item { background: var(--negro-card); border: 1px solid #222; padding: 20px; border-radius: 20px; margin-bottom: 15px; text-align: left; }
        .prod-name { font-size: 1.2rem; font-weight: 900; color: var(--amarillo); text-transform: uppercase; }

        .payment-group { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; }
        .btn-offer { width: 100%; padding: 14px; border-radius: 10px; font-weight: 900; border: none; cursor: pointer; display: flex; justify-content: space-between; font-size: 0.75rem; }
        .btn-paypal { background: var(--azul-paypal); color: #fff; }

        .legal-link { font-size: 0.7rem; color: var(--gris-texto); cursor: pointer; display: block; text-align: center; margin-top: 20px; text-decoration: underline; }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="location.reload()">
            <div class="logo-icon">W</div> WANTED
        </div>
        <select class="lang-switch" id="langSelector">
            <option value="es">ESPAÑOL</option>
            <option value="en">ENGLISH</option>
        </select>
    </header>

    <div class="trending-bar">
        <div class="trending-track">
            <span class="trending-item">🔥 Tendencia: <span>Teléfonos Inteligentes</span></span>
            <span class="trending-item">🔥 Tendencia: <span>Repuestos Automotrices</span></span>
            <span class="trending-item">🔥 Tendencia: <span>PlayStation 5</span></span>
        </div>
    </div>

    <div class="container">
        <div id="authSection" class="card">
            <h1 id="txt-h1">CONEXIÓN DE <span>VENTAS GLOBAL</span></h1>
            <form id="authForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="pass" placeholder="Password" required minlength="6">
                <button type="submit" class="btn-main" id="btn-auth">ACCEDER AL SISTEMA</button>
            </form>
            <p class="legal-link" onclick="toggleMode()" id="switchBtn">¿Nuevo usuario? Crear cuenta</p>
        </div>

        <div id="mainPanel" style="display: none;">
            <div class="card">
                <h2 style="font-size: 1.1rem; line-height: 1.4;">Publica lo que buscas</h2>
                <form id="orderForm">
                    <input type="text" id="prod" placeholder="Ej: iPhone 15 Pro Max" required>
                    <input type="number" id="cant" placeholder="Cantidad" required>
                    <button type="submit" class="btn-main" id="btn-launch">LANZAR PEDIDO</button>
                </form>
            </div>
            <div id="feed"></div>
            <p onclick="signOut()" style="color:red; font-size:0.7rem; cursor:pointer; text-align:center; margin-top:40px; opacity:0.5;">CERRAR SESIÓN SEGURA</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gtngqwnbyjqqmuzsztnv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0bmdxd25ieWpxcW11enN6dG52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNjgyMzksImV4cCI6MjA4ODk0NDIzOX0.vSxxHrayzEJG_HwRXcyOCb5vZuDZksrQe6GnAwhYD1w';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        let userCountry = "Detectando..."; 
        let modeLogin = true;

        // CORRECCIÓN CLAVE: Usamos HTTPS para que el navegador no bloquee la detección
        async function fetchGeo() {
            try {
                const response = await fetch('https://ipapi.co/json/');
                const data = await response.json();
                userCountry = data.country_name || "Global";
            } catch (error) {
                userCountry = "Global";
            }
            console.log("Ubicación detectada:", userCountry);
        }

        fetchGeo();

        async function sendAlert(prod, cant, user, location) {
            const token = '8639151291:AAH0njnCbBeGhOd90ZFUnPUFLWS1W-t37AE'; 
            const chatId = '7660494923'; 
            const msg = `🚨 WANTED: NUEVO PEDIDO\n\n📦 Art: ${prod}\n🔢 Cant: ${cant}\n👤 User: ${user}\n📍 País: ${location}`;
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`);
        }

        function toggleMode() {
            modeLogin = !modeLogin;
            document.getElementById('txt-h1').innerHTML = modeLogin ? 'CONEXIÓN DE <span>VENTAS GLOBAL</span>' : 'REGISTRO DE <span>IDENTIDAD REAL</span>';
            document.getElementById('btn-auth').innerText = modeLogin ? 'ACCEDER AL SISTEMA' : 'REGISTRARME';
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            if (modeLogin) {
                const { error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) alert(error.message);
            } else {
                const { error } = await _supabase.auth.signUp({ email, password });
                if (error) alert(error.message);
                else alert("Registro exitoso.");
            }
        });

        _supabase.auth.onAuthStateChange(async (event, session) => {
            if (session) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('mainPanel').style.display = 'block';
                if(userCountry === "Detectando...") await fetchGeo();
                renderPedidos();
            }
        });

        async function renderPedidos() {
            const { data } = await _supabase.from('pedidos').select('*').order('id', { ascending: false });
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            data.forEach(p => {
                const card = document.createElement('div');
                card.className = 'pedido-item';
                card.innerHTML = `
                    <span class="prod-name">${p.producto}</span>
                    <p style="font-size:0.8rem; color:#888;">Cantidad: ${p.cantidad} | Ubicación: ${p.ubicacion || 'Global'}</p>
                    <div class="payment-group">
                        <button class="btn-offer btn-paypal" onclick="window.location.href='https://paypal.me/wantedsolutions/3.73'">
                            OFERTAR (PAYPAL) <span>3.73 USD</span>
                        </button>
                    </div>
                `;
                feed.appendChild(card);
            });
        }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(userCountry === "Detectando...") await fetchGeo();

            const { data: { user } } = await _supabase.auth.getUser();
            const prod = document.getElementById('prod').value;
            const cant = document.getElementById('cant').value;
            
            const { error } = await _supabase.from('pedidos').insert([{ 
                nombre: user.email, 
                producto: prod, 
                cantidad: parseInt(cant),
                ubicacion: userCountry 
            }]);
            
            if (!error) { 
                sendAlert(prod, cant, user.email, userCountry);
                renderPedidos(); 
                document.getElementById('orderForm').reset();
            }
        });

        function signOut() { _supabase.auth.signOut(); location.reload(); }
    </script>
</body>
            </html>
