<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WantedReverse | Sistema Global</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --amarillo: #FFD700; --negro-puro: #0a0a0a; --negro-card: #141414; --gris-texto: #8e8e93; --blanco: #ffffff; --azul-paypal: #0070ba; }
        body { background-color: var(--negro-puro); color: var(--blanco); font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        header { width: 100%; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #222; background: rgba(0,0,0,0.95); position: sticky; top: 0; z-index: 1000; box-sizing: border-box; }
        .brand { display: flex; align-items: center; gap: 12px; font-size: 1.5rem; font-weight: 900; color: var(--amarillo); letter-spacing: -1px; cursor: pointer; }
        .logo-icon { width: 45px; height: 35px; background: var(--amarillo); color: #000; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-size: 1.2rem; font-weight: 900; }
        .container { width: 95%; max-width: 450px; margin-top: 20px; }
        .card { background: var(--negro-card); padding: 30px; border-radius: 24px; border: 1px solid #333; text-align: center; margin-bottom: 20px; }
        input, select { width: 100%; padding: 16px; margin-bottom: 15px; background: #000; border: 1px solid #333; border-radius: 12px; color: #fff; box-sizing: border-box; }
        .btn-main { width: 100%; padding: 18px; background: var(--amarillo); color: #000; border: none; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .pedido-item { background: var(--negro-card); border: 1px solid #222; padding: 20px; border-radius: 20px; margin-bottom: 15px; text-align: left; }
        .prod-name { font-size: 1.2rem; font-weight: 900; color: var(--amarillo); text-transform: uppercase; }
        .btn-offer { width: 100%; padding: 14px; border-radius: 10px; font-weight: 900; border: none; cursor: pointer; background: var(--azul-paypal); color: #fff; display: flex; justify-content: space-between; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="brand" onclick="location.reload()"><div class="logo-icon">WR</div> WantedReverse</div>
    </header>

    <div class="container">
        <div id="authSection" class="card">
            <h1>ACCESO <span>SISTEMA</span></h1>
            <form id="authForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="pass" placeholder="Password" required>
                <button type="submit" class="btn-main" id="btn-auth">INGRESAR</button>
            </form>
            <p id="switchBtn" onclick="toggleMode()" style="cursor:pointer; font-size:0.8rem; margin-top:15px; color:var(--gris-texto)">¿No tienes cuenta? Regístrate</p>
        </div>

        <div id="mainPanel" style="display: none;">
            <div class="card">
                <form id="orderForm">
                    <select id="cat_id" required>
                        <option value="1">Electrónica</option>
                        <option value="11">Celulares</option>
                        <option value="30">Otros</option>
                    </select>
                    <input type="text" id="prod" placeholder="Producto que buscas" required>
                    <input type="number" id="cant" placeholder="Cantidad" required>
                    <button type="submit" class="btn-main" id="btn-launch">LANZAR PEDIDO</button>
                </form>
            </div>
            <div id="feed"></div>
            <p onclick="signOut()" style="color:red; font-size:0.7rem; cursor:pointer; text-align:center; margin-top:40px;">CERRAR SESIÓN</p>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gtngqwnbyjqqmuzsztnv.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0bmdxd25ieWpxcW11enN6dG52Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzMzNjgyMzksImV4cCI6MjA4ODk0NDIzOX0.vSxxHrayzEJG_HwRXcyOCb5vZuDZksrQe6GnAwhYD1w';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let modeLogin = true;
        let userCountry = "Global";

        // Función de Alerta (Telegram) corregida
        function sendAlert(prod, cant, user, location) {
            const token = '8639151291:AAH0njnCbBeGhOd90ZFUnPUFLWS1W-t37AE';
            const chatId = '7660494923';
            const msg = `🚨 NUEVO PEDIDO:\n📦 ${prod}\n🔢 Cant: ${cant}\n👤 ${user}\n📍 ${location}`;
            // Se usa no-cors para evitar que bloqueos de navegador frenen el proceso
            fetch(`https://api.telegram.org/bot${token}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(msg)}`, { mode: 'no-cors' });
        }

        function toggleMode() {
            modeLogin = !modeLogin;
            document.getElementById('btn-auth').innerText = modeLogin ? 'INGRESAR' : 'REGISTRARME';
        }

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;
            const { error } = modeLogin ? 
                await _supabase.auth.signInWithPassword({ email, password }) : 
                await _supabase.auth.signUp({ email, password });
            if (error) alert(error.message);
        });

        _supabase.auth.onAuthStateChange((event, session) => {
            if (session) {
                document.getElementById('authSection').style.display = 'none';
                document.getElementById('mainPanel').style.display = 'block';
                renderPedidos();
            }
        });

        async function renderPedidos() {
            const { data, error } = await _supabase.from('pedidos').select('*').order('id', { ascending: false });
            if (error) { console.error(error); return; }
            const feed = document.getElementById('feed');
            feed.innerHTML = '';
            data.forEach(p => {
                feed.innerHTML += `
                    <div class="pedido-item">
                        <div class="prod-name">${p.producto}</div>
                        <p style="font-size:0.8rem; color:#888;">Cant: ${p.cantidad} | De: ${p.nombre}</p>
                        <button class="btn-offer" onclick="window.location.href='https://paypal.me/wantedreverse/3.73'">
                            OFERTAR <span>3.73 USD</span>
                        </button>
                    </div>`;
            });
        }

        document.getElementById('orderForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-launch');
            btn.innerText = "PROCESANDO...";
            btn.disabled = true;

            const { data: { user } } = await _supabase.auth.getUser();
            const prod = document.getElementById('prod').value;
            const cant = document.getElementById('cant').value;

            // 1. DISPARO INMEDIATO DE TELEGRAM
            sendAlert(prod, cant, user.email, userCountry);

            // 2. INSERCIÓN (Simplificada al máximo para evitar fallos de RLS)
            const { error } = await _supabase.from('pedidos').insert([
                { nombre: user.email, producto: prod, cantidad: parseInt(cant), ubicacion: userCountry }
            ]);

            if (error) {
                alert("Error de Base de Datos: " + error.message);
            } else {
                document.getElementById('orderForm').reset();
            }

            // Refrescar siempre
            setTimeout(() => {
                renderPedidos();
                btn.innerText = "LANZAR PEDIDO";
                btn.disabled = false;
            }, 1000);
        });

        function signOut() { _supabase.auth.signOut(); location.reload(); }
    </script>
</body>
                                                    </html>
